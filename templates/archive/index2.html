{% extends "layout.html" %}

{% block body %}

    <h1>Menu</h1>

    <form action="/" method="post">
        sort by
        <select name="sort_by">
            <option value="id">default</option>
            {% for k in keys %}
                <option ({% if k == sort %} selected {% endif %}) value="{{k}}">{{k}}</option>
            {% endfor %}
        </select>
        reverse<input type="checkbox" ({% if desc %} checked {% endif %}) name="reverse">
        <button type="submit">Sort</button>
    </form>

    <table>
        <tr>
            {% for k in keys %}
                <th>{{k}}</th>
            {% endfor %}
        </tr>

        {% for item in menu %}
            <tr>
                {% for k in keys %}
                    {% if k == "price" %}
                        <td>{{item[k] | usd}}</td>
                    {% else %}
                        <td>{{item[k]}}</td>
                    {% endif %}
                {% endfor %}
                <td>
                    <span>
                        <form action="/del" method="post">
                            <input hidden name="id" value="{{item["id"]}}">
                            <button>delete</button>
                        </form>
    
                        <form action="/edit" method="post">
                            <input hidden name="id" value="{{item["id"]}}">
                            <input hidden name="food" value="{{item['name']}}">
                            <input hidden name="price" value="{{item['price']}}">
                            <input hidden name="calories" value="{{item['calories']}}">
                            <button>Edit</button>
                        </form>
                    </span>
                </td>
            </tr>
        {% endfor %}        
        
    </table>

    <a href="/add">Add items</a>

{% endblock %}
