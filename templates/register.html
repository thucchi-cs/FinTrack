{% extends "layout.html" %}

{% block body %}

    <div class="register-container">
        <div class="register-left">
            <div class="branding-texts">
                <h1>FinTrack</h1>
                <p>Your personal finance management app.</p>
            </div>
        </div>
    
        <div class="register-right">
            <div class="register-card">
                <h2>Register</h2>
                <form action="/register" method="POST">
                    <input type="text" autofocus autocomplete="off" name="username" placeholder="Username">
                    <input type="password" autocomplete="off" name="password" placeholder="Password">
                    <input type="password" autocomplete="off" name="password2" placeholder="Confirm Password">
                    <p>Password must have:</p>
                    <p>• at least 8 characters</p>
                    <p>• an uppercase letter and a lowercase letter</p>
                    <p>• a special symbol</p>

                    <input type="number" autocomplete="off" name="balance" placeholder="Account starting balance">

                    <div class="checkbox-container">
                        <span>
                            <input type="checkbox" name="student" id="student_check">
                        </span>
                        <span>
                            <label for="student_check">I am a student</label>
                        </span>
                    </div>
                    
            
                    <button type="submit">Register</button>
                </form>
        
                <p class="login-text">
                Already have an account? <a href="/login">Login</a>
                </p>
            </div>
        </div>
    </div>
  

{% endblock %}
